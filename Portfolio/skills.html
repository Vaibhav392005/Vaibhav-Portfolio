<!DOCTYPE html>
<html>
<head>
<title>Skills | Vaibhav</title>

<style>
body{
background:#0f172a;
color:white;
font-family:Poppins;
padding:40px;
}

h1{text-align:center;}

.skills{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-top:40px;
}

.card{
background:#111827;
padding:20px;
border-radius:12px;
transition:0.3s;
}

.card:hover{
transform:translateY(-10px);
box-shadow:0 0 20px #38bdf8;
}

.progress{
height:6px;
background:#333;
margin-top:10px;
}

.progress div{
height:100%;
background:#38bdf8;
}
</style>
</head>

<body>

<h1>Technical Skills</h1>

<div class="skills">

<div class="card">
<h3>CAD Design</h3>
<p>SolidWorks, CATIA, Fusion 360</p>
<div class="progress"><div style="width:90%"></div></div>
</div>

<div class="card">
<h3>CAE Analysis</h3>
<p>ANSYS, Thermal, Stress</p>
<div class="progress"><div style="width:85%"></div></div>
</div>

<div class="card">
<h3>Manufacturing</h3>
<p>CNC, GD&T</p>
<div class="progress"><div style="width:80%"></div></div>
</div>

<div class="card">
<h3>Programming</h3>
<p>Python, Excel</p>
<div class="progress"><div style="width:70%"></div></div>
</div>

<div class="card">
<h3>Engineering Tools</h3>
<p>FMEA, Problem Solving</p>
<div class="progress"><div style="width:85%"></div></div>
</div>

</div>

</body>
</html>
